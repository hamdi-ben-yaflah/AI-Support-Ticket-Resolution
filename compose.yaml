services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: support_copilot
      POSTGRES_USER: support_copilot
      POSTGRES_PASSWORD: support_copilot_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - support-copilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_copilot -d support_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: support_copilot_test
      POSTGRES_USER: support_copilot_test
      POSTGRES_PASSWORD: support_copilot_test_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - support-copilot-postgres-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_copilot_test -d support_copilot_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  support-copilot-postgres:
  support-copilot-postgres-test:
