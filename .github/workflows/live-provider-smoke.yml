name: Live provider browser smoke

on:
  workflow_dispatch:

concurrency:
  group: live-provider-browser-smoke
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.21.0"
  DATABASE_URL: postgresql://support_copilot_smoke:support_copilot_smoke@127.0.0.1:5432/support_copilot_smoke_test
  LIVE_PROVIDER_SMOKE: "true"
  LIVE_PROVIDER_SMOKE_BUDGET_USD: ${{ vars.LIVE_PROVIDER_SMOKE_BUDGET_USD }}

jobs:
  smoke:
    name: One synthetic live resolution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ai-evaluation
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
        env:
          POSTGRES_DB: support_copilot_smoke_test
          POSTGRES_PASSWORD: support_copilot_smoke
          POSTGRES_USER: support_copilot_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support_copilot_smoke -d support_copilot_smoke_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Ingest synthetic knowledge base
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: pnpm ingest
      - name: Run explicitly budgeted smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          SESSION_COOKIE_SECRET: ci-only-session-secret-for-live-smoke-32-chars
        run: pnpm test:e2e:live
