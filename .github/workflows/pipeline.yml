name: CI and production delivery

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.21.0"
  PGVECTOR_IMAGE: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      APP_VERSION: ${{ github.sha }}
      ENABLE_LIVE_EVALUATIONS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Check committed migrations
        run: pnpm db:check
      - name: Run deterministic tests with coverage
        run: pnpm test:coverage
      - name: Build deployment operations
        run: pnpm build:operations
      - name: Build Next.js
        run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Upload unit-test and coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence-${{ github.sha }}
          path: |
            artifacts/unit-tests.xml
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
        env:
          POSTGRES_DB: support_copilot_ci_test
          POSTGRES_PASSWORD: support_copilot_ci
          POSTGRES_USER: support_copilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support_copilot_ci -d support_copilot_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://support_copilot_ci:support_copilot_ci@127.0.0.1:5432/support_copilot_ci_test
      TEST_DATABASE_URL: postgresql://support_copilot_ci:support_copilot_ci@127.0.0.1:5432/support_copilot_ci_test
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply committed migrations
        run: pnpm db:migrate
      - name: Run isolated database integration tests
        run: pnpm test:integration
      - name: Upload integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-evidence-${{ github.sha }}
          path: artifacts/integration-tests.xml
          if-no-files-found: warn
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  container:
    name: Verify production container
    needs: [quality, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
        env:
          POSTGRES_DB: support_copilot_container_test
          POSTGRES_PASSWORD: support_copilot_container
          POSTGRES_USER: support_copilot_container
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support_copilot_container -d support_copilot_container_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the immutable runtime image
        env:
          IMAGE_TAG: support-copilot:${{ github.sha }}
        run: |
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --target runtime \
            --build-arg APP_VERSION="${GITHUB_SHA}" \
            --build-arg OCI_REVISION="${GITHUB_SHA}" \
            --build-arg OCI_SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "${IMAGE_TAG}" \
            .
      - name: Start and smoke-test the runtime image
        env:
          IMAGE_TAG: support-copilot:${{ github.sha }}
        run: |
          docker run --detach --name support-copilot-smoke \
            --add-host host.docker.internal:host-gateway \
            --publish 3000:3000 \
            --env APP_VERSION="${GITHUB_SHA}" \
            --env DATABASE_URL=postgresql://support_copilot_container:support_copilot_container@host.docker.internal:5432/support_copilot_container_test \
            --env ENABLE_LIVE_EVALUATIONS=false \
            --env SKIP_KNOWLEDGE_INGESTION=true \
            "${IMAGE_TAG}"

          ready=false
          for attempt in $(seq 1 30); do
            payload=$(curl --silent --show-error --max-time 3 http://127.0.0.1:3000/api/health/live || true)
            if jq --exit-status --arg revision "${GITHUB_SHA}" '.status == "ok" and .version == $revision' <<<"${payload}" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "${ready}" != true ]; then
            docker logs support-copilot-smoke
            exit 1
          fi

          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/api/health/ready >/dev/null
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/ >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/admin/evaluations)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/evaluations/runs)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{"concurrency":3}' http://127.0.0.1:3000/api/evaluations/run)" = 404
      - name: Scan repository dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: artifacts/trivy-filesystem.sarif
      - name: Scan runtime image
        if: ${{ always() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: support-copilot:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: artifacts/trivy-image.sarif
      - name: Save verified image for publication
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && success() }}
        run: docker save support-copilot:${GITHUB_SHA} --output /tmp/support-copilot-image.tar
      - name: Upload verified image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-runtime-image-${{ github.sha }}
          path: /tmp/support-copilot-image.tar
          compression-level: 0
          retention-days: 1
      - name: Upload vulnerability evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-evidence-${{ github.sha }}
          path: artifacts/trivy-*.sarif
          if-no-files-found: warn
          retention-days: 7
      - name: Show container logs on failure
        if: ${{ failure() }}
        run: docker logs support-copilot-smoke 2>/dev/null || true
      - name: Stop smoke container
        if: ${{ always() }}
        run: docker stop --time 20 support-copilot-smoke 2>/dev/null || true

  publish:
    name: Publish verified image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Download verified image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-runtime-image-${{ github.sha }}
          path: /tmp/verified-image
      - name: Load verified image
        run: docker load --input /tmp/verified-image/support-copilot-image.tar
      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${image_name}" >> "${GITHUB_OUTPUT}"
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish SHA and main tags
        id: publish
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker tag "support-copilot:${GITHUB_SHA}" "${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "support-copilot:${GITHUB_SHA}" "${IMAGE_NAME}:main"
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:main"
          docker pull "${IMAGE_NAME}:${GITHUB_SHA}" >/dev/null
          digest=$(docker image inspect "${IMAGE_NAME}:${GITHUB_SHA}" --format '{{index .RepoDigests 0}}' | sed 's/.*@//')
          test -n "${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Prepare supply-chain artifacts
        run: mkdir -p artifacts
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: artifacts/support-copilot.spdx.json
          upload-artifact: false
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: artifacts/support-copilot.spdx.json
          retention-days: 30
      - name: Attest published image provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
    env:
      EXPECTED_IMAGE: ${{ needs.publish.outputs.image }}
      EXPECTED_IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Trigger Dokploy application deployment
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
        run: |
          case "${EXPECTED_IMAGE_DIGEST}" in
            sha256:[0-9a-f]*) ;;
            *) echo "Published image digest is missing or invalid." >&2; exit 1 ;;
          esac
          case "${DOKPLOY_URL}" in
            https://*) ;;
            *) echo "DOKPLOY_URL must use HTTPS." >&2; exit 1 ;;
          esac
          request=$(jq --null-input --compact-output --arg applicationId "${DOKPLOY_APPLICATION_ID}" '{applicationId: $applicationId}')
          curl --fail --silent --show-error --max-time 20 \
            --request POST \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "x-api-key: ${DOKPLOY_API_TOKEN}" \
            --data "${request}" \
            "${DOKPLOY_URL%/}/api/application.deploy" >/dev/null
      - name: Wait for the expected revision
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          case "${PRODUCTION_URL}" in
            https://*) ;;
            *) echo "PRODUCTION_URL must use HTTPS." >&2; exit 1 ;;
          esac
          converged=false
          for attempt in $(seq 1 40); do
            payload=$(curl --silent --show-error --max-time 8 "${PRODUCTION_URL%/}/api/health/live" || true)
            if jq --exit-status --arg revision "${GITHUB_SHA}" '.status == "ok" and .version == $revision' <<<"${payload}" >/dev/null; then
              converged=true
              break
            fi
            sleep 15
          done
          if [ "${converged}" != true ]; then
            echo "Production did not converge to the expected revision before the deadline." >&2
            exit 1
          fi
      - name: Run production smoke checks
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          base_url="${PRODUCTION_URL%/}"
          curl --fail --silent --show-error --max-time 15 "${base_url}/" >/dev/null
          curl --fail --silent --show-error --max-time 10 "${base_url}/api/health/live" >/dev/null
          curl --fail --silent --show-error --max-time 10 "${base_url}/api/health/ready" >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "${base_url}/admin/evaluations")" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "${base_url}/api/evaluations/runs")" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 --request POST --header 'Content-Type: application/json' --data '{"concurrency":3}' "${base_url}/api/evaluations/run")" = 404
          echo "Deployed ${EXPECTED_IMAGE}@${EXPECTED_IMAGE_DIGEST} at revision ${GITHUB_SHA}." >> "${GITHUB_STEP_SUMMARY}"
